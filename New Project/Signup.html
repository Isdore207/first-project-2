<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign UP</title>
</head>
<body>
    <h1>Sign UP</h1>
    <form>
        <label>Full Name</label>
        <br>
        <input type="text" placeholder="Enter your full name">
        <br>
        <label>Email</label>
        <br>
        <input type="Email">
        <br>
        <label>Password</label>
        <br>
        <input type="password">
        <br>
        <label>Date of birth</label>
        <br>
        <input type="date">
        <br>
        <label>About Your Self</label>
        <br>
        <textarea name="text" placeholder="Tell Us About Your Self"></textarea>
        <br>
        <button>Sign Up</button>
        <br>
        
        <hr>
        <a href="Login.html">Login</a>
    </form>
</body>
</html>
